<div class="todo-container">
  <h1>{{ title() }}</h1>

  <!-- Input Form -->
  <div class="todo-form">
    <!-- Notice the signal structure matching your binding layer -->
    <input 
      type="text" 
      [ngModel]="newTodoTitle()"
      (ngModelChange)="newTodoTitle.set($event)"
      (keyup.enter)="addNewTodo()" 
      placeholder="What needs to be done currently?" 
      maxLength="100"
    />
    <button (click)="addNewTodo()">Add Task</button>
  </div>

  <!-- Todo List -->
  <ul class="todo-list">
    <!-- Invoking the todos signal container dynamically -->
    @for (todo of todos(); track todo._id) {
      <li [class.completed]="todo.isCompleted">
        <div class="todo-item-left">
          <input 
            type="checkbox" 
            [checked]="todo.isCompleted" 
            (change)="toggleTodo(todo)"
            class="todo-checkbox"
          />
          <div class="todo-content">
            <span class="todo-text">{{ todo.title }}</span>
            <span class="todo-date" *ngIf="todo.createdAt">
              {{ todo.createdAt | date:'MMM d' }}
            </span>
          </div>
        </div>
        <button class="delete-btn" (click)="removeTodo(todo._id)">✕</button>
      </li>
    } @empty {
      <div class="empty-state">
        <p>No tasks left!</p>
      </div>
    }
  </ul>
</div>
