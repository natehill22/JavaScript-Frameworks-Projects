<mat-card>
   @if (isLoading()) {
   <mat-spinner></mat-spinner>
   }
   <!--Shows the login form (with email and password fields) if state is not loading-->
   @if (!isLoading()) {
    <!--Connects the submit button with the Login functionality-->
    <form (submit)="onLogin(loginForm)" #loginForm="ngForm">
     <mat-form-field>
        <input matInput name="email" ngModel type="email" placeholder="E-mail" #emailInput="ngModel" required email>
        @if (emailInput.invalid) {
        <mat-error>Please enter a valid email.</mat-error>
        }
     </mat-form-field>
     <mat-form-field>
        <input type="password" name="password" ngModel matInput placeholder="Password" #passwordInput="ngModel" required>
        @if (passwordInput.invalid) {
        <mat-error>Please enter a valid password.</mat-error>
        }
     </mat-form-field>
     
        <button mat-raised-button type="submit">Login</button>
    </form>
   }
</mat-card>
