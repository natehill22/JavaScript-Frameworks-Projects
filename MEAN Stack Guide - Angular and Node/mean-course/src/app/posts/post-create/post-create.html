<mat-card>
   @if (isLoading()) {
   <mat-spinner></mat-spinner>
   }
   <!--Shows title, content and image inputs if state is not loading-->
   @if (!isLoading()) {
    <form [formGroup]="form" (submit)="onSavePost()">
     <mat-form-field>
        <input matInput type="text" formControlName="title" placeholder="Post Title">
        <!--Error handling for title input-->
        @if (form.get('title')?.invalid) {
        <mat-error>Please enter a post title</mat-error>
        }
     </mat-form-field>
     <div>
      <!--Image loader button-->
      <button mat-stroked-button type="button" (click)="filePicker.click()">Pick Image</button>
      <input type="file" #filePicker (change)="onImagePicked($event)">
     </div>
     @if (imagePreview() && form.get('image')?.valid) {
     <div class="image-preview">
      <img [src]="imagePreview()" [alt]="form.value.title">
     </div>
      }
     <mat-form-field>
        <textarea matInput rows="6" formControlName="content" placeholder="Post Content"></textarea>
        <!--Error handling for content input-->
        @if (form.get('content')?.invalid) {
        <mat-error>Please enter post content</mat-error>
        }
     </mat-form-field>
        <button mat-raised-button type="submit">Save Post</button>
    </form>
   }
</mat-card>
