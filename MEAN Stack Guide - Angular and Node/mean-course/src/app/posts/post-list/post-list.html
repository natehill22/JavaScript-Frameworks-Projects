<div style="background: yellow; color: black; padding: 15px; z-index: 9999; position: relative;">
  <h3>Debug Dashboard</h3>
  <p>Array Length: {{ posts.length }}</p>
  <ul>
    <li *ngFor="let p of posts">Raw Post: {{ p.title }} - {{ p.content }}</li>
  </ul>
</div>

<mat-spinner *ngIf="isLoading"></mat-spinner>
<mat-accordion multi="true" *ngIf="posts.length > 0 && !isLoading">
    <mat-expansion-panel *ngFor="let post of posts">
        <mat-expansion-panel-header>
            {{ post.title }}
        </mat-expansion-panel-header>
        <p>{{ post.content }}</p>
        <mat-action-row>
            <a mat-button [routerLink]="['/edit', post.id]">Edit</a>
            <button mat-button (click)="onDelete(post.id)">Delete</button>
        </mat-action-row>
    </mat-expansion-panel>
</mat-accordion>
<p class="info-text mat-body-1" *ngIf="posts.length === 0 && !isLoading">No Posts added</p>
